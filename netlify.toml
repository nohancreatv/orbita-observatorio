[build]
  command = "pnpm run build:netlify"
  publish = "dist/public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[dev]
  command = "pnpm run dev"
  targetPort = 3000
  port = 8888

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Proxy para assets estáticos hospedados no armazenamento original.
[[redirects]]
  from = "/manus-storage/*"
  to = "https://isswatcher-8zu9asw5.manus.space/manus-storage/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/privacidade"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/termos"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/fontes"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://pagead2.googlesyndication.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.nasa.gov https://staticmap.openstreetmap.de https://*.googlesyndication.com https://*.doubleclick.net https://*.google.com https://d36hbw14aib5lz.cloudfront.net https://isswatcher-8zu9asw5.manus.space; connect-src 'self' https://*.googlesyndication.com https://*.doubleclick.net https://*.google.com; frame-src https://*.googlesyndication.com https://*.doubleclick.net https://*.google.com; upgrade-insecure-requests"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=(), usb=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
