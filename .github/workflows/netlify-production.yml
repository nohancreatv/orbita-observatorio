name: Validar aplicação para Netlify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validar aplicação
    runs-on: ubuntu-latest
    env:
      NASA_API_KEY: ci-test-key-not-for-api
      VITE_ADSENSE_PUBLISHER_ID: ca-pub-5884730150482896
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Verificar tipos
        run: pnpm check

      - name: Executar testes
        run: pnpm test

      - name: Validar build e função Netlify
        run: pnpm exec netlify build --offline


# A publicação é feita pela integração automática do projeto no Netlify.
# Este workflow verifica tipos, testes e o empacotamento da função.
