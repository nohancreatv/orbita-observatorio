[build]
  command = "pnpm run build:netlify"
  publish = "dist/public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[dev]
  command = "pnpm run dev"
  targetPort = 3000
  port = 8888

# API proxy — deve ser PRIMEIRO para capturar /api/* antes do SPA
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA routes — devem vir DEPOIS dos assets estáticos
[[redirects]]
  from = "/privacidade"
  to = "/privacidade/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/termos"
  to = "/termos/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/fontes"
  to = "/fontes/index.html"
  status = 200
  force = true

# NÃO usar redirect catch-all /* → 404.html
# O Netlify já retorna 404 automaticamente para arquivos inexistentes
# Um redirect catch-all COM status 4xx BLOQUEIA arquivos estáticos (imagens, CSS, JS)

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://pagead2.googlesyndication.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.nasa.gov https://eoimages.gsfc.nasa.gov https://staticmap.openstreetmap.de https://server.arcgisonline.com https://maps.googleapis.com https://*.googlesyndication.com https://*.doubleclick.net https://*.google.com https://d36hbw14aib5lz.cloudfront.net; connect-src 'self' https://*.googlesyndication.com https://*.doubleclick.net https://*.google.com; frame-src https://*.googlesyndication.com https://*.doubleclick.net https://*.google.com; upgrade-insecure-requests"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=(), usb=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
